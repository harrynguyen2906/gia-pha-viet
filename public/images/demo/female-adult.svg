<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#160c1a"/>
      <stop offset="100%" stop-color="#0c0810"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="rgba(197,160,89,0.4)" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="100" cy="162" rx="38" ry="27" fill="rgba(197,160,89,0.1)" stroke="rgba(197,160,89,0.22)" stroke-width="1.5"/>
  <path d="M72 147 Q100 136 128 147 L130 176 Q100 168 70 176 Z" fill="rgba(197,160,89,0.14)" stroke="rgba(197,160,89,0.28)" stroke-width="1"/>
  <!-- Head (slightly smaller = younger woman) -->
  <circle cx="100" cy="84" r="26" fill="rgba(244,235,208,0.82)" stroke="rgba(197,160,89,0.35)" stroke-width="1.5"/>
  <!-- Long hair (sides) -->
  <path d="M74 78 Q68 110 72 135 Q80 128 76 110 Q78 90 74 78Z" fill="rgba(35,22,12,0.88)"/>
  <path d="M126 78 Q132 110 128 135 Q120 128 124 110 Q122 90 126 78Z" fill="rgba(35,22,12,0.88)"/>
  <!-- Hair top -->
  <path d="M74 78 Q76 58 100 56 Q124 58 126 78 Q116 68 100 67 Q84 68 74 78Z" fill="rgba(35,22,12,0.9)"/>
  <!-- Simple hair ornament -->
  <path d="M100 58 Q96 50 100 47 Q104 50 100 58Z" fill="rgba(197,160,89,0.6)"/>
  <!-- Eyes (almond shape) -->
  <path d="M86 82 Q90 79 94 82 Q90 86 86 82Z" fill="rgba(30,18,8,0.95)"/>
  <path d="M106 82 Q110 79 114 82 Q110 86 106 82Z" fill="rgba(30,18,8,0.95)"/>
  <!-- Eye shine -->
  <circle cx="90" cy="81" r="1" fill="rgba(255,255,255,0.65)"/>
  <circle cx="110" cy="81" r="1" fill="rgba(255,255,255,0.65)"/>
  <!-- Eyebrows (thin, arched) -->
  <path d="M85 76 Q90 73 95 75" stroke="rgba(50,32,18,0.8)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M105 75 Q110 73 115 76" stroke="rgba(50,32,18,0.8)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose (subtle) -->
  <path d="M99 87 Q100 92 101 87" stroke="rgba(190,155,120,0.45)" stroke-width="1" fill="none"/>
  <!-- Lips -->
  <path d="M92 97 Q100 102 108 97" stroke="rgba(200,110,95,0.85)" stroke-width="2" fill="rgba(200,110,95,0.3)" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="83" cy="91" rx="7" ry="4" fill="rgba(220,130,115,0.15)"/>
  <ellipse cx="117" cy="91" rx="7" ry="4" fill="rgba(220,130,115,0.15)"/>
</svg>
