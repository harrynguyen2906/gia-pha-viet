<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#060d14"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="rgba(197,160,89,0.4)" stroke-width="2"/>
  <!-- Shoulders -->
  <ellipse cx="100" cy="165" rx="45" ry="25" fill="rgba(197,160,89,0.1)" stroke="rgba(197,160,89,0.22)" stroke-width="1.5"/>
  <path d="M65 148 Q100 135 135 148 L136 178 Q100 170 64 178 Z" fill="rgba(197,160,89,0.15)" stroke="rgba(197,160,89,0.28)" stroke-width="1"/>
  <!-- Head (slightly larger = young man, fuller face) -->
  <circle cx="100" cy="83" r="30" fill="rgba(244,235,208,0.88)" stroke="rgba(197,160,89,0.35)" stroke-width="1.5"/>
  <!-- Short neat hair -->
  <path d="M70 80 Q72 56 100 54 Q128 56 130 80 Q126 66 100 64 Q74 66 70 80Z" fill="rgba(28,18,10,0.92)"/>
  <!-- Eyes (wider, youthful) -->
  <ellipse cx="89" cy="82" rx="5" ry="4" fill="rgba(28,16,8,0.95)"/>
  <ellipse cx="111" cy="82" rx="5" ry="4" fill="rgba(28,16,8,0.95)"/>
  <!-- Eye shine -->
  <circle cx="90.5" cy="80.5" r="1.5" fill="rgba(255,255,255,0.75)"/>
  <circle cx="112.5" cy="80.5" r="1.5" fill="rgba(255,255,255,0.75)"/>
  <!-- Eyebrows (defined) -->
  <path d="M83 74 Q89 71 95 73.5" stroke="rgba(28,18,10,0.9)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M105 73.5 Q111 71 117 74" stroke="rgba(28,18,10,0.9)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Nose (confident, straighter) -->
  <path d="M97 87 L97 95 Q100 97 103 95 L103 87" stroke="rgba(180,140,108,0.55)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Mouth (slight smile) -->
  <path d="M90 101 Q100 107 110 101" stroke="rgba(170,105,85,0.85)" stroke-width="2.2" fill="rgba(170,105,85,0.2)" stroke-linecap="round"/>
  <!-- Jawline (stronger) -->
  <path d="M71 85 Q70 108 100 118 Q130 108 129 85" stroke="rgba(197,160,89,0.08)" stroke-width="0.5" fill="none"/>
</svg>
