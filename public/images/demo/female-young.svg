  <path d="M106 73.5 Q111 71 116 74" stroke="rgba(42,28,16,0.75)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M99 86 Q100 91 101 86" stroke="rgba(190,155,120,0.4)" stroke-width="1" fill="none"/>
  <!-- Lips (fuller, youthful) -->
  <path d="M91 97 Q95 94 100 95 Q105 94 109 97" stroke="rgba(200,105,88,0.9)" stroke-width="1.5" fill="rgba(200,105,88,0.35)" stroke-linecap="round"/>
  <path d="M91 97 Q100 103 109 97" stroke="rgba(200,105,88,0.9)" stroke-width="2" fill="none" stroke-linecap="round"/>
