  <!-- Lashes (top) -->
  <path d="M85 80 Q89 76 93 80" stroke="rgba(20,12,5,0.7)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M107 80 Q111 76 115 80" stroke="rgba(20,12,5,0.7)" stroke-width="1" fill="none" stroke-linecap="round"/>
