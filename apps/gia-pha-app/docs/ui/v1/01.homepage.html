<script data-purpose="countdown-logic">
    // Mock Countdown functionality
    function updateCountdown() {
      const timerElement = document.querySelector('[data-purpose="countdown-clock"] .text-2xl');
      if (!timerElement) return;

      let time = timerElement.innerText.split(':').map(Number);
      let seconds = time[0] * 3600 + time[1] * 60 + time[2];

      if (seconds > 0) {
        seconds--;
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        timerElement.innerText = `${h}:${m}:${s}`;
      }
    }
    setInterval(updateCountdown, 1000);
  </script>
