<html class="dark" lang="vi"><head>

<title>Heritage Cloud - Bản Đồ Gia Tộc</title>
<!-- Google Fonts: EB Garamond, Playfair Display, Noto Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&amp;family=Playfair+Display:wght@700&amp;family=Noto+Sans:wght@400;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'antique-gold': '#C5A059',
                'gold-leaf': '#E5C17C',
                'lacquer': '#1a0808', 
                'heritage-red': '#8a0000',
                'heritage-dark': '#0d0404',
                'parchment': '#F4EBD0',

              fontFamily: {
                serif: ['"EB Garamond"', 'serif'],

<style data-purpose="custom-styling">
        body {
          background-color: #0d0404;
          color: #F4EBD0;
          font-family: 'Noto Sans', sans-serif;
        }
        .map-container {
          background-color: #0d0404;
          background-image: radial-gradient(circle at center, #1a0808 0%, #0d0404 100%);
        }
        .map-overlay {
          background: radial-gradient(circle, rgba(13,4,4,0) 0%, rgba(13,4,4,0.9) 100%);
        }
        /* Ornate corner borders */
        .shrine-card {
            position: relative;
            border: 1px solid #C5A059;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .shrine-card::before, .shrine-card::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border: 1.5px solid #C5A059;
            pointer-events: none;
            z-index: 10;
        }
        .shrine-card::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
        .shrine-card::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }

        .pulse-gold {
          box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7);
          animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.7); }
          70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(197, 160, 89, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(197, 160, 89, 0); }
        }
        .golden-lotus {
            filter: drop-shadow(0 0 4px #C5A059);
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

<div>

</div>

<div class="absolute inset-0 bg-black/10 flex items-center justify-center">

                        </span>

<script data-purpose="map-interactions">
    // Entrance animation for the card
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.querySelector('[data-purpose="grave-info-card"]');
        if (card) {
            card.style.transform = 'translateY(100%)';
            card.style.opacity = '0';
            card.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
            setTimeout(() => {
                card.style.transform = 'translateY(0)';
                card.style.opacity = '1';
            }, 500);
        }
    });
</script>
