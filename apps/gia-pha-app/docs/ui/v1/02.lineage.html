<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Heritage Cloud - Gia Phả Việt</title>
<!-- Load Tailwind CSS with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Load Noto Serif Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<!-- BEGIN: Tailwind Configuration -->
<script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                'antique-gold': '#C5A059',
                'gold-leaf': '#E5C17C',
                'lacquer': '#1a0808', // Deep Dark Lacquer
                'heritage-red': '#8a0000',
                'heritage-dark': '#121212',
              },
              fontFamily: {
                serif: ['Noto Serif', 'serif'],
              },
              borderRadius: {
                'custom': '1rem',
              }
            }
          }
        }
    </script>
<!-- END: Tailwind Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="layout-and-textures">
        body {
            background-color: #1a0808; /* Dark lacquer background */
            font-family: "Noto Serif", serif;
            color: #E5C17C;
        }
        /* Premium Lacquer/Parchment card effect */
        .parchment-card {
            background: linear-gradient(145deg, #2a0f0f, #1a0808);
            border: 1px solid #C5A059;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .parchment-card.living {
            border: 2px solid #C5A059;
            background: linear-gradient(135deg, #f4ebd0 0%, #e5c17c 100%);
            color: #1a0808;
        }
        /* Connecting lines logic - elegant gold leaf style */
        .tree-connector {
            position: absolute;
            background: linear-gradient(to bottom, #C5A059, #E5C17C);
            z-index: 0;
            box-shadow: 0 0 5px rgba(197, 160, 89, 0.3);
        }
        .line-v {
            width: 1.5px;
            height: 32px;
            left: 50%;
            transform: translatex(-50%);
        }
        .line-h {
            height: 1.5px;
            top: -16px;
            background: linear-gradient(to right, #C5A059, #E5C17C, #C5A059);
        }
        /* Grayscale filter for deceased ancestors */
        .ancestor-deceased {
            filter: grayscale(100%);
            opacity: 0.9;
        }
        .deceased-card {
            border: 1px solid rgba(197, 160, 89, 0.4);
            background: rgba(42, 15, 15, 0.8);
        }
        /* Golden Lotus Marker */
        .golden-lotus {
            filter: drop-shadow(0 0 2px #C5A059);
        }
    </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen pb-24">
<!-- BEGIN: Navigation and Search Controls -->

<div>

<p class="text-[10px] text-antique-gold uppercase tracking-tighter">Cây Gia Hệ Trực Tuyến</p>
</div>
</div>
<button class="text-antique-gold">

<svg class="h-4 w-4 absolute left-3 top-1/2 -translate-y-1/2 text-antique-gold/60" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>

</div>
</header>
<!-- END: Navigation and Search Controls -->

</div>
</div>
</div>
</div>

<!-- GENERATION 3 -->
<section class="relative pt-4" data-purpose="generation">
<div class="tree-connector line-h left-[10%] right-[10%]"></div>
<div class="flex gap-8">
<!-- Grandchild 1 -->
<div class="flex flex-col items-center relative">
<div class="tree-connector line-v top-[-16px]"></div>
<div class="parchment-card living w-40 p-2 rounded-custom shadow-md text-lacquer">

<img alt="Thành viên" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbFfsPyOjibw_HLV6jVmdIuW2lL5o_xGUzKZM_KQMmGoLspidPrIZ9rSNBZHZ5p6RrQ5yKEJr8zuNyiB-qhAD6Obbrs6HrbX2eacG9thlwGek1bo5smQbvltou4SimlN3jI9l6HcfbXJcH8Pho0_D-uHkQe2wLMSDQIp4IlMp1Ca5g78LNLF-iR0m-DnLNLAyV7pNB6kPrMwfQ3IKUVWVIHn3qbJORzLvExouWOOTWYpltYjAutZPdXN-e1cOclq4KzEmnOP-p54_A"/>

</div>
<!-- Grandchild 2 -->

<p class="text-[10px] opacity-70">1965 - Nay</p>

</div>
</div>
</div>

</div>
